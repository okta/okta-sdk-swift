version: 2.1

orbs:
  general-platform-helpers: okta/general-platform-helpers@1.9

executors:
  apple-ci-arm-medium:
    macos:
      xcode: 14.3.1
    resource_class: macos.m1.medium.gen1

jobs:
  setup:
    executor: apple-ci-arm-medium
    steps:
      - run:
          name: Manual HTTPS checkout (avoid SSH)
          command: |
            git --version
            rm -rf .git || true
            git init .
            git remote add origin https://github.com/okta/okta-sdk-swift.git
            git fetch --depth=1 origin master
            git checkout --force master
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  snyk-scan:
    executor: apple-ci-arm-medium
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Install rosetta # Needed for snyk to work on M1 machines.
          command: softwareupdate --install-rosetta --agree-to-license
      - run:
          name: run swift package show dependencies
          command: swift package show-dependencies
      - general-platform-helpers/step-load-dependencies
      - general-platform-helpers/step-run-snyk-monitor:
          scan-all-projects: true
          skip-unresolved: false
          run-on-non-main: true
          os: macos

workflows:
  semgrep:
    jobs:
      - general-platform-helpers/job-semgrep-scan:
          name: semgrep-scan
          context:
            - static-analysis
  security-scan:
    jobs:
      - setup
      - snyk-scan:
          name: execute-snyk
          requires:
            - setup
          context:
            - static-analysis
